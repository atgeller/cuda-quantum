name: qlx
description: "Pipeline for lowering to QLX-digestible Quake"
cudaq-version: 0.16.0

# This pipeline lowers complex dynamic kernels into QLX p0
# canonicalize + globalize-array-values + constant-propagation  ← fold cc.const_array to have constant sequence sizes
# canonicalize + cc-loop-unroll                                 ← unroll with now-constant trip counts
# cc-sroa + canonicalize                                        ← scalar-replace allocas for more folding
# decomposition{basis=...} + canonicalize                       ← expand exp_pauli to H/CNOT/Rz
# convert-to-linear-values + canonicalize                       ← ref-semantics → wire-semantics
# convert-quake-to-qlx                                          ← wire Quake → QLX P0

config:
  # TODO: add QLX runtime endpoint when it's implemented
  jit-mid-level-pipeline: "canonicalize,globalize-array-values,func.func(constant-propagation,canonicalize,cc-loop-unroll,cc-sroa,canonicalize),decomposition{basis=h,s,t,rx,ry,rz,x,y,z,x(1),y(1),z(1),x(2),z(2)},canonicalize,convert-to-linear-values,canonicalize,convert-quake-to-qlx"
  plugin-libraries:
    - _qlxRuntime.so
